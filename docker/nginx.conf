user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/errors.log debug;

    sendfile on;
    keepalive_timeout 65;

    # Include other conf files
    #include /etc/nginx/conf.d/*.conf;

    server {
        listen 80;
        server_name localhost;

        # Define the root directory for the site
        root /usr/share/nginx/html;

        # Serve requests without extensions by trying .html
        location / {
            try_files $uri $uri.html $uri/ =404;
        }

        # Serve JavaScript files with caching and MIME type handling
        location ~ \.js$ {
            expires 7d;
            add_header Content-Type application/javascript;
            access_log off;
        }

        # Serve PNG files with caching and MIME type handling
        location ~ \.png$ {
            expires 30d;
            add_header Content-Type image/png;
            access_log off;
        }

        # Custom 404 error page
        error_page 404 /404.html;
        location = /404.html {
            internal;
        }
    }
}